<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/index.css">
    <title>App de Previsão do Tempo</title>
</head>

<body>
    <div class="cartao">
        <div class="pesquisa">
            <input type="texto" placeholder="coloque o nome da cidade" spellcheack="false">
            <button><img src="/assets/img/search.png"></button>
        </div>
        <div class="error">
            <p><strong>Cidade Invalida</strong></p>
        </div>
        <div class="weather">
            <img src="/assets/img/rain.png" class="weather-icon">
            <h1 class="temp">25°c</h1>
            <h2 class="city">São Paulo</h2>
            <div class="detalhes">
                <div class="coluna">
                    <img src="/assets/img/humidity.png">
                    <div>
                        <p class="humidity">40%</p>
                        <p>Umidade</p>
                    </div>
                </div>
                <div class="coluna">
                    <img src="/assets/img/wind.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Vento</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        const apiKey = `9cbd70d837ee1b2f27aef2b99a1cb2f5`;
        const apiUrl = `https://api.openweathermap.org/data/2.5/weather?units=metric&q=`;

        const searchBox = document.querySelector(".pesquisa input");
        const searchBtn = document.querySelector(".pesquisa button");
        const weatherIcon = document.querySelector(".weather-icon");

        async function checkWheather(city) {
            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

            if (response.status == 404) {
                document.querySelector(".error").style.display = "block";
                document.querySelector(".weather").style.display = "none";
            } else { 
                                 
                var data = await response.json();

                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

                if (data.weather[0].main == "Clouds") {
                    weatherIcon.src = "../assets/img/clouds.png";
                }
                else if (data.weather[0].main == "Clear") {
                    weatherIcon.src = "../assets/img/clear.png";
                }
                else if (data.weather[0].main == "Rain") {
                    weatherIcon.src = "../assets/img/rain.png";
                }
                else if (data.weather[0].main == "Drizzle") {
                    weatherIcon.src = "../assets/img/drizzle.png";
                }
                else if (data.weather[0].main == "Mist") {
                    weatherIcon.src = "../assets/img/mist.png";
                }

                document.querySelector(".weather").style.display = "block";
                document.querySelector(".error").style.display = "none";
            }

        }
        searchBtn.addEventListener("click", () => {
            checkWheather(searchBox.value);
        })

        checkWheather();
    </script>
</body>

</html>
